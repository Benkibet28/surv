<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SurveyFlow · premium surveys</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    body { background: #f9fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header */
    .app-header { background: white; box-shadow: 0 2px 15px rgba(0,0,0,0.03); padding: 0.9rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edeff2; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo i { font-size: 1.8rem; color: #3b5bdb; background: #eef2ff; padding: 8px; border-radius: 14px; }
    .logo span { font-weight: 700; font-size: 1.35rem; color: #1e293b; }
    .user-badge { display: flex; align-items: center; gap: 15px; }
    .user-badge .avatar { width: 42px; height: 42px; background: #3b5bdb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.1rem; }
    .btn-logout { background: transparent; border: 1px solid #dee2e6; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 500; color: #475569; cursor: pointer; transition: 0.15s; }
    .btn-logout:hover { background: #f1f5f9; }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; }

    /* Auth Screens */
    .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
    .auth-card { background: white; width: 100%; max-width: 420px; padding: 2.2rem 2rem; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); border: 1px solid #ffffff50; }
    .auth-card h2 { font-size: 1.9rem; font-weight: 700; color: #0b1b32; margin-bottom: 0.25rem; }
    .auth-subhead { color: #64748b; font-size: 0.95rem; margin-bottom: 1.8rem; border-bottom: 1px solid #eef2f6; padding-bottom: 1.2rem; }
    .input-group { margin-bottom: 1.2rem; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 500; color: #334155; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 16px; font-size: 0.95rem; background: #fafcff; transition: 0.2s; }
    .input-group input:focus { outline: none; border-color: #3b5bdb; box-shadow: 0 0 0 4px rgba(59,91,219,0.1); background: white; }
    .btn-primary { background: #3b5bdb; color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary:hover { background: #2f4bb5; }
    .auth-switch { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #475569; }
    .auth-switch a { color: #3b5bdb; font-weight: 600; cursor: pointer; text-decoration: none; }

    /* Dashboard */
    .welcome-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .welcome-bar h1 { font-size: 1.8rem; font-weight: 700; color: #0b1b32; }
    .premium-badge { background: #fef9e7; border: 1px solid #f7e9b0; padding: 8px 18px; border-radius: 40px; color: #b78103; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .survey-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.8rem; margin-top: 1rem; }
    .survey-card { background: white; border-radius: 24px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.02); border: 1px solid #edf2f7; display: flex; flex-direction: column; }
    .card-icon { background: #eef2ff; width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #3b5bdb; font-size: 1.6rem; margin-bottom: 1.2rem; }
    .survey-card h3 { font-size: 1.25rem; font-weight: 600; color: #0b1b32; margin-bottom: 6px; }
    .survey-desc { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 1.2rem; flex: 1; }
    .survey-meta { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 1rem; margin-top: 0.4rem; }
    .reward { background: #f0fdf4; color: #15803d; font-weight: 600; padding: 6px 12px; border-radius: 40px; font-size: 0.85rem; }
    .premium-tag { background: #fefce8; color: #a16207; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 30px; border: 1px solid #fde68a; text-transform: uppercase; }
    .btn-survey { background: #3b5bdb; color: white; border: none; padding: 12px 16px; border-radius: 40px; font-weight: 500; font-size: 0.9rem; cursor: pointer; margin-top: 1rem; transition: 0.15s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-survey:hover { background: #2f4bb5; }
    .btn-survey.locked { background: #e9ecf0; color: #8b9eb0; cursor: not-allowed; }

    /* M-Pesa Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.2s ease; padding: 1rem; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .payment-modal { background: white; max-width: 420px; width: 100%; border-radius: 36px; padding: 2rem 1.8rem 1.8rem; box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4); transform: scale(0.95); transition: 0.2s; max-height: 90vh; overflow-y: auto; }
    .modal-overlay.active .payment-modal { transform: scale(1); }
    .payment-modal h2 { font-size: 1.5rem; font-weight: 700; color: #0b1b32; display: flex; align-items: center; gap: 10px; margin-bottom: 0.3rem; }
    .payment-modal h2 i { color: #4caf50; }
    .mpesa-tagline { color: #64748b; font-size: 0.85rem; margin-bottom: 1.4rem; border-bottom: 1px solid #eef2f6; padding-bottom: 1rem; }
    .paybill-info { background: #f0f9ff; border: 1px solid #cce7ff; border-radius: 20px; padding: 1rem 1.2rem; margin-bottom: 1.4rem; }
    .paybill-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #d4e8f5; }
    .paybill-row:last-child { border-bottom: none; }
    .paybill-label { font-size: 0.85rem; color: #475569; font-weight: 500; }
    .paybill-value { font-weight: 700; color: #0b1b32; font-size: 1rem; font-family: monospace; background: white; padding: 4px 12px; border-radius: 8px; border: 1px solid #cce7ff; }
    .paybill-value.highlight { color: #059669; }
    .amount-highlight { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-radius: 20px; padding: 1.2rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; border: 1px solid #bbf7d0; }
    .amount-highlight span:first-child { color: #166534; font-weight: 600; }
    .amount-highlight .cash { font-weight: 800; font-size: 2rem; color: #15803d; }
    .cash::before { content: 'KSh '; font-size: 1.1rem; color: #166534; }
    .payment-steps { background: #f8fafc; border-radius: 16px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; font-size: 0.82rem; color: #475569; line-height: 1.6; border-left: 3px solid #3b5bdb; }
    .modal-actions { display: flex; gap: 12px; }
    .btn-secondary { background: transparent; border: 1.5px solid #e2e8f0; padding: 12px 16px; border-radius: 40px; font-weight: 500; color: #475569; cursor: pointer; flex: 1; }
    .btn-pay { background: #15803d; color: white; border: none; padding: 12px 16px; border-radius: 40px; font-weight: 600; cursor: pointer; flex: 2; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-pay:hover { background: #166534; }
    .btn-pay:disabled { opacity: 0.7; cursor: not-allowed; }
    
    /* Verification Simulator */
    .stk-screen { text-align: center; padding: 1rem 0; }
    .stk-screen .phone-icon { font-size: 3.5rem; color: #4caf50; margin-bottom: 1rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .stk-screen h3 { font-size: 1.2rem; font-weight: 700; color: #0b1b32; margin-bottom: 0.5rem; }
    .stk-screen p { color: #64748b; font-size: 0.9rem; margin-bottom: 1.2rem; }
    .stk-checkmarks { background: #f0fdf4; border-radius: 16px; padding: 1rem; text-align: left; margin-bottom: 1.2rem; font-size: 0.85rem; }
    .stk-checkmarks div { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: #166534; }
    
    /* Toast */
    .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; font-weight: 500; font-size: 0.9rem; opacity: 0; transition: 0.25s; z-index: 2000; pointer-events: none; }
    .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .footer-note { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 3rem; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <i class="fas fa-chart-simple"></i>
    <span>SurveyFlow</span>
  </div>
  <div class="user-badge" id="userBadge" style="display: none;">
    <div class="avatar" id="avatarInitials">S</div>
    <span class="name" id="userNameDisplay">Survey Taker</span>
    <button class="btn-logout" id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Logout</button>
  </div>
</header>

<main class="container" id="mainContainer"></main>

<div class="modal-overlay" id="paymentModal">
  <div class="payment-modal" id="paymentModalContent"></div>
</div>

<div class="toast-message" id="toast"></div>

<script>
  (function() {
    // ================= M-PESA CONFIG =================
    const PAYBILL_NUMBER = '400200';
    const ACCOUNT_NUMBER = '01102360343001';
    const PREMIUM_AMOUNT = 200;

    // ================= MOCK BACKEND =================
    const USERS_KEY = 'survey_users';
    const SESSION_KEY = 'survey_session';

    function seedUsers() {
      if (!localStorage.getItem(USERS_KEY)) {
        localStorage.setItem(USERS_KEY, JSON.stringify([
          { email: 'demo@survey.com', password: 'demo123', name: 'Demo User', premium: false }
        ]));
      }
    }
    seedUsers();

    function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
    function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
    function setSession(user) { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
    function getSession() { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    function clearSession() { localStorage.removeItem(SESSION_KEY); }

    function updatePremiumStatus(email, premium) {
      const users = getUsers();
      const idx = users.findIndex(u => u.email === email);
      if (idx !== -1) {
        users[idx].premium = premium;
        saveUsers(users);
        const session = getSession();
        if (session && session.email === email) {
          session.premium = premium;
          setSession(session);
        }
      }
    }

    // ================= STATE & DOM =================
    let currentUser = getSession();
    const mainContainer = document.getElementById('mainContainer');
    const userBadge = document.getElementById('userBadge');
    const avatarInitials = document.getElementById('avatarInitials');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const logoutBtn = document.getElementById('logoutBtn');
    const toastEl = document.getElementById('toast');
    const paymentModal = document.getElementById('paymentModal');
    const paymentModalContent = document.getElementById('paymentModalContent');

    function showToast(message, duration = 3000) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function updateHeader() {
      if (currentUser) {
        userBadge.style.display = 'flex';
        const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        avatarInitials.textContent = initials;
        userNameDisplay.textContent = currentUser.name;
      } else {
        userBadge.style.display = 'none';
      }
    }

    // ================= AUTH =================
    function renderLogin() {
      mainContainer.innerHTML = `
        <div class="auth-wrapper">
          <div class="auth-card">
            <h2>Welcome back</h2>
            <div class="auth-subhead">Log in to access your surveys</div>
            <form id="loginForm">
              <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" value="demo@survey.com" required>
              </div>
              <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" value="demo123" required>
              </div>
              <button type="submit" class="btn-primary"><i class="fas fa-arrow-right-to-bracket"></i> Log in</button>
            </form>
            <div class="auth-switch">New here? <a id="switchToRegister">Create an account</a></div>
          </div>
        </div>
      `;
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const user = getUsers().find(u => u.email === email && u.password === password);
        if (user) {
          currentUser = { email: user.email, name: user.name, premium: user.premium };
          setSession(currentUser);
          updateHeader();
          renderDashboard();
          showToast(`Welcome back, ${user.name}!`);
        } else {
          showToast('Invalid email or password');
        }
      });
      document.getElementById('switchToRegister').addEventListener('click', renderRegister);
    }

    function renderRegister() {
      mainContainer.innerHTML = `
        <div class="auth-wrapper">
          <div class="auth-card">
            <h2>Create account</h2>
            <div class="auth-subhead">Join SurveyFlow and start earning</div>
            <form id="registerForm">
              <div class="input-group">
                <label>Full name</label>
                <input type="text" id="regName" placeholder="Jane Doe" required>
              </div>
              <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="jane@example.com" required>
              </div>
              <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a password" required>
              </div>
              <button type="submit" class="btn-primary"><i class="fas fa-user-plus"></i> Sign up</button>
            </form>
            <div class="auth-switch">Already have an account? <a id="switchToLogin">Log in</a></div>
          </div>
        </div>
      `;
      document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        if (!name || !email || !password) return showToast('Please fill all fields');
        
        const users = getUsers();
        if (users.some(u => u.email === email)) return showToast('Email already registered');
        
        users.push({ email, password, name, premium: false });
        saveUsers(users);
        
        currentUser = { email, name, premium: false };
        setSession(currentUser);
        updateHeader();
        renderDashboard();
        showToast(`Welcome, ${name}!`);
      });
      document.getElementById('switchToLogin').addEventListener('click', renderLogin);
    }

    // ================= DASHBOARD =================
    function renderDashboard() {
      if (!currentUser) return renderLogin();
      
      const isPremium = currentUser.premium;
      const surveys = [
        { id: 1, title: 'Shopping habits', desc: 'Tell us about your weekly shopping.', reward: 'KSh 50', premium: false, icon: 'fa-bag-shopping' },
        { id: 2, title: 'Streaming preferences', desc: 'Which platforms do you use?', reward: 'KSh 60', premium: false, icon: 'fa-tv' },
        { id: 3, title: 'Premium: Travel & leisure', desc: 'Detailed survey about your travel plans.', reward: 'KSh 250', premium: true, icon: 'fa-plane' },
        { id: 4, title: 'Premium: Financial wellness', desc: 'Exclusive survey about saving habits.', reward: 'KSh 300', premium: true, icon: 'fa-chart-pie' },
      ];

      mainContainer.innerHTML = `
        <div class="welcome-bar">
          <div>
            <h1>Hi, ${currentUser.name.split(' ')[0]} 👋</h1>
            <p>Pick a survey and start earning today.</p>
          </div>
          ${isPremium 
            ? `<div class="premium-badge"><i class="fas fa-crown"></i> Premium active</div>` 
            : `<div class="premium-badge" style="background:#f1f5f9; border-color:#e2e8f0; color:#475569;"><i class="fas fa-lock"></i> Premium locked</div>`}
        </div>
        <div class="survey-grid" id="surveyGrid"></div>
        <div class="footer-note">SurveyFlow · Paybill ${PAYBILL_NUMBER}</div>
      `;

      const grid = document.getElementById('surveyGrid');
      surveys.forEach(survey => {
        const isLocked = survey.premium && !isPremium;
        const card = document.createElement('div');
        card.className = 'survey-card';
        card.innerHTML = `
          <div class="card-icon"><i class="fas ${survey.icon}"></i></div>
          <h3>${survey.title}</h3>
          <p class="survey-desc">${survey.desc}</p>
          <div class="survey-meta">
            <span class="reward"><i class="fas fa-coins"></i> ${survey.reward}</span>
            ${survey.premium ? '<span class="premium-tag"><i class="fas fa-crown"></i> Premium</span>' : ''}
          </div>
          <button class="btn-survey ${isLocked ? 'locked' : ''}" data-id="${survey.id}" data-premium="${survey.premium}">
            ${isLocked ? `<i class="fas fa-lock"></i> Unlock – KSh ${PREMIUM_AMOUNT}` : '<i class="fas fa-play"></i> Start survey'}
          </button>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll('.btn-survey').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.premium === 'true' && !getSession().premium) {
            openPaymentModal();
          } else {
            showToast('Starting survey (demo)');
          }
        });
      });
    }

    // ================= MANUAL PAYBILL FLOW =================
    function openPaymentModal() {
      paymentModalContent.innerHTML = `
        <h2><i class="fas fa-mobile-screen-button"></i> M-Pesa Paybill</h2>
        <div class="mpesa-tagline">Follow the steps below on your phone to complete the payment.</div>
        
        <div class="paybill-info">
          <div class="paybill-row">
            <span class="paybill-label">Paybill Number</span>
            <span class="paybill-value highlight">${PAYBILL_NUMBER}</span>
          </div>
          <div class="paybill-row">
            <span class="paybill-label">Account Number</span>
            <span class="paybill-valu
